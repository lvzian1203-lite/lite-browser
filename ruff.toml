# ruff 配置：只启用"确定是问题"的规则。
#
# 本项目的目标是修复安全问题而不是统一代码风格，因此这里**不**启用格式化类规则，
# 避免对既有代码产生成百上千条与安全无关的告警。
# 选中的都是硬错误：
#   E9  —— 语法错误
#   F63 —— 无效转义序列 / assert 用法错误
#   F7  —— 表达式中的语法问题
#   F82 —— 未定义名、未定义变量、星号导入相关
line-length = 110
target-version = "py313"

[lint]
select = ["E9", "F63", "F7", "F82"]

exclude = [
    "build",
    "dist",
    "build-installer",
    "lib",
    ".venv",
]
